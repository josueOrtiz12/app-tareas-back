services:
  app-tareas-db:
    container_name: app-tareas-database
    image: postgres:16-alpine
    restart: always
    env_file:
       - ./.env 
    environment:
      POSTGRES_USER: ${DB_USER}   
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5432:5432"
    volumes:
      - tareas-db-data:/var/lib/postgresql/data
    networks:
      - tareas-network

  app-tareas-back:
    container_name: app-tareas-backend
    image: node:20-slim
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - app-tareas-db
    env_file:
       - ./.env             
    command: sh -c "npm install && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - tareas-network

volumes:
  tareas-db-data:

networks:
  tareas-network:
    external: true